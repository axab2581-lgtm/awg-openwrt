name: Build AmneziaWG for Cudy WR1300S (exact kernel ABI)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wr1300s-awg-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout AmneziaWG packages
        uses: actions/checkout@v4

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools python3-pyelftools \
            rsync swig unzip zlib1g-dev file wget curl ccache

      - name: Checkout exact OpenWrt source revision
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/5yoda5/openwrt.git openwrt
          cd openwrt
          git checkout --detach 1e9ffdbcc52e6cfbfa1a1378c9107894be1be819
          test "$(git rev-parse HEAD)" = "1e9ffdbcc52e6cfbfa1a1378c9107894be1be819"
          grep -q '^LINUX_VERSION-6.12 = .74$' target/linux/generic/kernel-6.12
          grep -q 'DEVICE_MODEL := WR1300S' target/linux/ramips/image/mt7621.mk
          grep -q 'TARGET_DEVICES += cudy_wr1300s' target/linux/ramips/image/mt7621.mk
          test -f target/linux/ramips/dts/mt7621_cudy_wr1300s.dts

          mkdir -p "$GITHUB_WORKSPACE/awg-feed"
          cp -a "$GITHUB_WORKSPACE/kmod-amneziawg" "$GITHUB_WORKSPACE/awg-feed/"
          cp -a "$GITHUB_WORKSPACE/amneziawg-tools" "$GITHUB_WORKSPACE/awg-feed/"
          cp -a "$GITHUB_WORKSPACE/luci-proto-amneziawg" "$GITHUB_WORKSPACE/awg-feed/"

          # Keep official OpenWrt feed definitions; this source tree has "packages", not "base".
          cp feeds.conf.default feeds.conf
          echo "src-link awg $GITHUB_WORKSPACE/awg-feed" >> feeds.conf
          ./scripts/feeds update packages
          ./scripts/feeds update luci
          ./scripts/feeds update awg
          ./scripts/feeds install -p awg kmod-amneziawg amneziawg-tools luci-proto-amneziawg

      - name: Configure the exact WR1300S target
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/diagnostics"
          mkdir -p "$GITHUB_WORKSPACE/diagnostics"
          cat > .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_cudy_wr1300s=y
          CONFIG_PACKAGE_amneziawg-tools=y
          CONFIG_PACKAGE_luci-proto-amneziawg=y
          CONFIG_PACKAGE_kmod-cfg80211=y
          CONFIG_PACKAGE_kmod-crypto-aead=y
          CONFIG_PACKAGE_kmod-crypto-authenc=y
          CONFIG_PACKAGE_kmod-crypto-ccm=y
          CONFIG_PACKAGE_kmod-crypto-cmac=y
          CONFIG_PACKAGE_kmod-crypto-crc32c=y
          CONFIG_PACKAGE_kmod-crypto-ctr=y
          CONFIG_PACKAGE_kmod-crypto-des=y
          CONFIG_PACKAGE_kmod-crypto-gcm=y
          CONFIG_PACKAGE_kmod-crypto-geniv=y
          CONFIG_PACKAGE_kmod-crypto-gf128=y
          CONFIG_PACKAGE_kmod-crypto-ghash=y
          CONFIG_PACKAGE_kmod-crypto-hash=y
          CONFIG_PACKAGE_kmod-crypto-hmac=y
          CONFIG_PACKAGE_kmod-crypto-hw-eip93=y
          CONFIG_PACKAGE_kmod-crypto-manager=y
          CONFIG_PACKAGE_kmod-crypto-md5=y
          CONFIG_PACKAGE_kmod-crypto-null=y
          CONFIG_PACKAGE_kmod-crypto-rng=y
          CONFIG_PACKAGE_kmod-crypto-seqiv=y
          CONFIG_PACKAGE_kmod-crypto-sha1=y
          CONFIG_PACKAGE_kmod-crypto-sha256=y
          CONFIG_PACKAGE_kmod-crypto-sha3=y
          CONFIG_PACKAGE_kmod-crypto-sha512=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_kmod-gpio-button-hotplug=y
          CONFIG_PACKAGE_kmod-hwmon-core=y
          CONFIG_PACKAGE_kmod-i2c-core=y
          CONFIG_PACKAGE_kmod-leds-gpio=y
          CONFIG_PACKAGE_kmod-lib-crc-ccitt=y
          CONFIG_PACKAGE_kmod-lib-crc32c=y
          CONFIG_PACKAGE_kmod-mac80211=y
          CONFIG_PACKAGE_kmod-mt76-connac=y
          CONFIG_PACKAGE_kmod-mt76-core=y
          CONFIG_PACKAGE_kmod-mt7603=y
          CONFIG_PACKAGE_kmod-mt7615-common=y
          CONFIG_PACKAGE_kmod-mt7615-firmware=y
          CONFIG_PACKAGE_kmod-mt7615e=y
          CONFIG_PACKAGE_kmod-nf-conntrack=y
          CONFIG_PACKAGE_kmod-nf-flow=y
          CONFIG_PACKAGE_kmod-nf-log=y
          CONFIG_PACKAGE_kmod-nf-log6=y
          CONFIG_PACKAGE_kmod-nf-nat=y
          CONFIG_PACKAGE_kmod-nf-reject=y
          CONFIG_PACKAGE_kmod-nf-reject6=y
          CONFIG_PACKAGE_kmod-nfnetlink=y
          CONFIG_PACKAGE_kmod-nft-core=y
          CONFIG_PACKAGE_kmod-nft-fib=y
          CONFIG_PACKAGE_kmod-nft-nat=y
          CONFIG_PACKAGE_kmod-nft-offload=y
          CONFIG_PACKAGE_kmod-nls-base=y
          CONFIG_PACKAGE_kmod-nls-cp437=y
          CONFIG_PACKAGE_kmod-nls-iso8859-1=y
          CONFIG_PACKAGE_kmod-nls-utf8=y
          CONFIG_PACKAGE_kmod-ppp=y
          CONFIG_PACKAGE_kmod-pppoe=y
          CONFIG_PACKAGE_kmod-pppox=y
          CONFIG_PACKAGE_kmod-scsi-core=y
          CONFIG_PACKAGE_kmod-slhc=y
          CONFIG_PACKAGE_kmod-usb-common=y
          CONFIG_PACKAGE_kmod-usb-core=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-usb-xhci-hcd=y
          CONFIG_PACKAGE_kmod-usb-xhci-mtk=y
          CONFIG_PACKAGE_kmod-usb3=y
          EOF
          make defconfig
          grep -Fqx 'CONFIG_TARGET_ramips=y' .config
          grep -Fqx 'CONFIG_TARGET_ramips_mt7621=y' .config
          grep -Fqx 'CONFIG_TARGET_ramips_mt7621_DEVICE_cudy_wr1300s=y' .config
          grep -Fqx 'CONFIG_PACKAGE_amneziawg-tools=y' .config
          grep -Fqx 'CONFIG_PACKAGE_luci-proto-amneziawg=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-cfg80211=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-crypto-aead=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-crypto-authenc=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-crypto-ccm=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-crypto-cmac=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-crypto-crc32c=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-crypto-ctr=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-crypto-des=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-crypto-gcm=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-crypto-geniv=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-crypto-gf128=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-crypto-ghash=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-crypto-hash=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-crypto-hmac=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-crypto-hw-eip93=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-crypto-manager=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-crypto-md5=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-crypto-null=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-crypto-rng=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-crypto-seqiv=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-crypto-sha1=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-crypto-sha256=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-crypto-sha3=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-crypto-sha512=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-fs-vfat=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-gpio-button-hotplug=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-hwmon-core=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-i2c-core=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-leds-gpio=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-lib-crc-ccitt=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-lib-crc32c=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-mac80211=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-mt76-connac=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-mt76-core=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-mt7603=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-mt7615-common=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-mt7615-firmware=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-mt7615e=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-nf-conntrack=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-nf-flow=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-nf-log=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-nf-log6=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-nf-nat=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-nf-reject=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-nf-reject6=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-nfnetlink=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-nft-core=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-nft-fib=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-nft-nat=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-nft-offload=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-nls-base=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-nls-cp437=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-nls-iso8859-1=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-nls-utf8=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-ppp=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-pppoe=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-pppox=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-scsi-core=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-slhc=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-usb-common=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-usb-core=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-usb-storage=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-usb-xhci-hcd=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-usb-xhci-mtk=y' .config
          grep -Fqx 'CONFIG_PACKAGE_kmod-usb3=y' .config
          echo "Kernel module selection after defconfig (diagnostic only):"
          grep -n 'kmod-amneziawg' .config || true
          cp .config "$GITHUB_WORKSPACE/diagnostics/openwrt.config"

      - name: Build OpenWrt host tools
        working-directory: openwrt
        shell: bash
        run: |
          set -o pipefail
          make -j2 tools/install V=s 2>&1 | tee "$GITHUB_WORKSPACE/diagnostics/tools-build.log"



      - name: Preflight kernel ABI before expensive compilation
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail
          EXPECTED='6.12.74~50c25113c07569854428230fbdfd4c63-r1'
          DIAG="$GITHUB_WORKSPACE/diagnostics"
          mkdir -p "$DIAG"
          set -o pipefail
          make -j2 target/linux/prepare V=s 2>&1 | tee "$DIAG/kernel-prepare.log"

          CONFIG_SET="$(find build_dir -type f -path '*/linux-6.12.74/.config.set' -print -quit)"
          if [ -z "$CONFIG_SET" ]; then
            echo "Kernel .config.set was not generated by target/linux/prepare."
            find build_dir -type f \( -name .config.set -o -name .vermagic -o -name .config.target -o -name .config.override \) -print
            exit 1
          fi

          KERNEL_DIR="$(dirname "$CONFIG_SET")"
          VERMAGIC_FILE="$KERNEL_DIR/.vermagic"
          if [ ! -s "$VERMAGIC_FILE" ]; then
            echo "Kernel .vermagic file is missing or empty: $VERMAGIC_FILE"
            exit 1
          fi

          ACTUAL="$(tr -d '\r\n' < "$VERMAGIC_FILE")"
          CALCULATED="$(grep '=[ym]' "$CONFIG_SET" | LC_ALL=C sort | md5sum | awk '{print $1}')"
          {
            echo "Expected kernel package version: $EXPECTED"
            echo "Actual .vermagic: $ACTUAL"
            echo "Recalculated .config.set MD5: $CALCULATED"
            echo "Kernel config directory: $KERNEL_DIR"
          } | tee "$DIAG/kernel-abi-preflight.txt"

          cp "$CONFIG_SET" "$DIAG/kernel.config.set"
          for name in .config.target .config.override .config; do
            [ ! -f "$KERNEL_DIR/$name" ] || cp "$KERNEL_DIR/$name" "$DIAG/kernel${name}"
          done

          if [ "$ACTUAL" != "$CALCULATED" ]; then
            echo "Internal check failed: .vermagic does not match the MD5 of enabled .config.set symbols."
            exit 1
          fi
          if [ "6.12.74~$ACTUAL-r1" != "$EXPECTED" ]; then
            echo "ABI mismatch: refusing to compile or publish packages for another kernel configuration."
            echo "The router expects $EXPECTED; this source/config produces 6.12.74~$ACTUAL-r1."
            exit 1
          fi

          echo "Kernel ABI matches the router. Expensive compilation may proceed."
          
      - name: Build and install target toolchain
        working-directory: openwrt
        shell: bash
        run: |
          set -o pipefail
          make -j2 toolchain/install V=s 2>&1 | tee "$GITHUB_WORKSPACE/diagnostics/toolchain-build.log"

      - name: Prepare and build the exact target kernel
        working-directory: openwrt
        shell: bash
        run: |
          set -o pipefail
          make -j2 target/linux/compile V=s 2>&1 | tee "$GITHUB_WORKSPACE/diagnostics/kernel-build.log"

      - name: Build AmneziaWG packages
        working-directory: openwrt
        shell: bash
        run: |
          set -o pipefail
          make -j2 \
            package/feeds/awg/kmod-amneziawg/compile \
            package/feeds/awg/amneziawg-tools/compile \
            package/feeds/awg/luci-proto-amneziawg/compile \
            V=s 2>&1 | tee "$GITHUB_WORKSPACE/diagnostics/build.log"

      - name: Verify kernel ABI and stage all packages
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail
          EXPECTED='6.12.74~50c25113c07569854428230fbdfd4c63-r1'
          mkdir -p "$GITHUB_WORKSPACE/diagnostics"
          mapfile -t KMOD_PACKAGES < <(find bin -type f -name 'kmod-amneziawg*.apk' -print)
          mapfile -t TOOLS_PACKAGES < <(find bin -type f -name 'amneziawg-tools*.apk' -print)
          mapfile -t LUCI_PACKAGES < <(find bin -type f -name 'luci-proto-amneziawg*.apk' -print)

          if [ "${#KMOD_PACKAGES[@]}" -ne 1 ]; then
            echo "Expected exactly one kmod-amneziawg APK; found ${#KMOD_PACKAGES[@]}"
            find bin -type f -name '*amneziawg*' -print
            exit 1
          fi
          if [ "${#TOOLS_PACKAGES[@]}" -ne 1 ] || [ "${#LUCI_PACKAGES[@]}" -ne 1 ]; then
            echo "Expected exactly one amneziawg-tools APK and one luci-proto-amneziawg APK."
            find bin -type f -name '*amneziawg*' -print
            exit 1
          fi

          # OpenWrt emits APK dependency metadata in the verbose apk mkpkg command.
          # Read it from the build log instead of treating the APK control archive as
          # a plain tar file.
          mapfile -t ACTUAL_KERNEL_DEPS < <(
            grep -oE 'depends:kernel=[^[:space:]]+' "$GITHUB_WORKSPACE/diagnostics/build.log" |
              sed 's/^depends:kernel=//' | sort -u
          )
          printf 'Expected kernel dependency: %s\n' "$EXPECTED" | tee "$GITHUB_WORKSPACE/diagnostics/kernel-abi-check.txt"
          printf 'Actual kernel dependency candidates:\n' | tee -a "$GITHUB_WORKSPACE/diagnostics/kernel-abi-check.txt"
          printf '%s\n' "${ACTUAL_KERNEL_DEPS[@]}" | tee -a "$GITHUB_WORKSPACE/diagnostics/kernel-abi-check.txt"

          if [ "${#ACTUAL_KERNEL_DEPS[@]}" -ne 1 ]; then
            echo "Could not determine one unique kernel dependency from the package build log."
            echo "See diagnostics/build.log and diagnostics/kernel-abi-check.txt."
            exit 1
          fi
          ACTUAL="${ACTUAL_KERNEL_DEPS[0]}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ABI MISMATCH: this build produced kernel dependency '$ACTUAL', but the router requires '$EXPECTED'."
            echo "Do not install this kmod on the router. The OpenWrt source/configuration must be aligned with the firmware build."
            exit 1
          fi

          KMOD="${KMOD_PACKAGES[0]}"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$KMOD" "${TOOLS_PACKAGES[0]}" "${LUCI_PACKAGES[0]}" "$GITHUB_WORKSPACE/dist/"
          printf '%s\n' "Verified dependency: kernel (= $EXPECTED)" > "$GITHUB_WORKSPACE/dist/ABI-VERIFIED.txt"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wr1300s-awg-build-diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload verified packages
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wr1300s-amneziawg-packages-verified
          path: dist/
          if-no-files-found: error
          retention-days: 30
