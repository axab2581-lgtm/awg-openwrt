name: Build AmneziaWG for Cudy WR1300S (exact kernel ABI)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wr1300s-awg-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout AmneziaWG packages
        uses: actions/checkout@v4

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools python3-pyelftools \
            rsync swig unzip zlib1g-dev file wget curl ccache

      - name: Checkout exact OpenWrt source revision
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/5yoda5/openwrt.git openwrt
          cd openwrt
          git checkout --detach 1e9ffdbcc52e6cfbfa1a1378c9107894be1be819
          test "$(git rev-parse HEAD)" = "1e9ffdbcc52e6cfbfa1a1378c9107894be1be819"
          grep -q '^LINUX_VERSION-6.12 = .74$' target/linux/generic/kernel-6.12
          grep -q 'DEVICE_MODEL := WR1300S' target/linux/ramips/image/mt7621.mk
          grep -q 'TARGET_DEVICES += cudy_wr1300s' target/linux/ramips/image/mt7621.mk
          test -f target/linux/ramips/dts/mt7621_cudy_wr1300s.dts

          mkdir -p "$GITHUB_WORKSPACE/awg-feed"
          cp -a "$GITHUB_WORKSPACE/kmod-amneziawg" "$GITHUB_WORKSPACE/awg-feed/"
          cp -a "$GITHUB_WORKSPACE/amneziawg-tools" "$GITHUB_WORKSPACE/awg-feed/"
          cp -a "$GITHUB_WORKSPACE/luci-proto-amneziawg" "$GITHUB_WORKSPACE/awg-feed/"

          # Keep official OpenWrt feed definitions; this source tree has "packages", not "base".
          cp feeds.conf.default feeds.conf
          echo "src-link awg $GITHUB_WORKSPACE/awg-feed" >> feeds.conf
          ./scripts/feeds update packages
          ./scripts/feeds update luci
          ./scripts/feeds update awg
          ./scripts/feeds install -p awg kmod-amneziawg amneziawg-tools luci-proto-amneziawg

      - name: Configure the exact WR1300S target
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/diagnostics"
          mkdir -p "$GITHUB_WORKSPACE/diagnostics"
          cat > .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_cudy_wr1300s=y
          CONFIG_PACKAGE_amneziawg-tools=y
          CONFIG_PACKAGE_luci-proto-amneziawg=y
          EOF
          make defconfig
          grep -Fqx 'CONFIG_TARGET_ramips=y' .config
          grep -Fqx 'CONFIG_TARGET_ramips_mt7621=y' .config
          grep -Fqx 'CONFIG_TARGET_ramips_mt7621_DEVICE_cudy_wr1300s=y' .config
          grep -Fqx 'CONFIG_PACKAGE_amneziawg-tools=y' .config
          grep -Fqx 'CONFIG_PACKAGE_luci-proto-amneziawg=y' .config
          echo "Kernel module selection after defconfig (diagnostic only):"
          grep -n 'kmod-amneziawg' .config || true
          cp .config "$GITHUB_WORKSPACE/diagnostics/openwrt.config"

      - name: Build OpenWrt host tools
        working-directory: openwrt
        shell: bash
        run: |
          set -o pipefail
          make -j2 tools/install V=s 2>&1 | tee "$GITHUB_WORKSPACE/diagnostics/tools-build.log"

      - name: Build and install target toolchain
        working-directory: openwrt
        shell: bash
        run: |
          set -o pipefail
          make -j2 toolchain/install V=s 2>&1 | tee "$GITHUB_WORKSPACE/diagnostics/toolchain-build.log"

      - name: Prepare and build the exact target kernel
        working-directory: openwrt
        shell: bash
        run: |
          set -o pipefail
          make -j2 target/linux/compile V=s 2>&1 | tee "$GITHUB_WORKSPACE/diagnostics/kernel-build.log"

      - name: Build AmneziaWG packages
        working-directory: openwrt
        shell: bash
        run: |
          set -o pipefail
          make -j2 \
            package/feeds/awg/kmod-amneziawg/compile \
            package/feeds/awg/amneziawg-tools/compile \
            package/feeds/awg/luci-proto-amneziawg/compile \
            V=s 2>&1 | tee "$GITHUB_WORKSPACE/diagnostics/build.log"

      - name: Verify kernel ABI and stage all packages
        working-directory: openwrt
        shell: bash
        run: |
          set -euxo pipefail
          EXPECTED='6.12.74~50c25113c07569854428230fbdfd4c63-r1'
          mapfile -t KMOD_PACKAGES < <(find bin -type f -name 'kmod-amneziawg*.apk' -print)
          mapfile -t TOOLS_PACKAGES < <(find bin -type f -name 'amneziawg-tools*.apk' -print)
          mapfile -t LUCI_PACKAGES < <(find bin -type f -name 'luci-proto-amneziawg*.apk' -print)

          if [ "${#KMOD_PACKAGES[@]}" -ne 1 ]; then
            echo "Expected exactly one kmod-amneziawg APK; found ${#KMOD_PACKAGES[@]}"
            find bin -type f -name '*amneziawg*' -print
            exit 1
          fi
          if [ "${#TOOLS_PACKAGES[@]}" -ne 1 ] || [ "${#LUCI_PACKAGES[@]}" -ne 1 ]; then
            echo "Expected exactly one amneziawg-tools APK and one luci-proto-amneziawg APK."
            find bin -type f -name '*amneziawg*' -print
            exit 1
          fi

          KMOD="${KMOD_PACKAGES[0]}"
          tar -xOf "$KMOD" .PKGINFO > "$GITHUB_WORKSPACE/diagnostics/kmod-amneziawg.PKGINFO"
          cat "$GITHUB_WORKSPACE/diagnostics/kmod-amneziawg.PKGINFO"
          if ! grep -Fqx "depend = kernel (= $EXPECTED)" "$GITHUB_WORKSPACE/diagnostics/kmod-amneziawg.PKGINFO"; then
            echo "ABI MISMATCH: package does not depend on the exact router kernel ABI."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$KMOD" "${TOOLS_PACKAGES[0]}" "${LUCI_PACKAGES[0]}" "$GITHUB_WORKSPACE/dist/"
          cp "$GITHUB_WORKSPACE/diagnostics/kmod-amneziawg.PKGINFO" "$GITHUB_WORKSPACE/dist/"
          printf '%s\n' "Verified dependency: kernel (= $EXPECTED)" > "$GITHUB_WORKSPACE/dist/ABI-VERIFIED.txt"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wr1300s-awg-build-diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload verified packages
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wr1300s-amneziawg-packages-verified
          path: dist/
          if-no-files-found: error
          retention-days: 30
